<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUALS HUB - 光影的轮廓</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
    <style>
        /* --- 1. 全局样式与 Apple 变量定义 --- */
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-color: #f5f5f7;
            --text-secondary: #86868b;
            --border-color: rgba(255, 255, 255, 0.08);
            --apple-blue: #0071e3;
            --nav-bg: rgba(0, 0, 0, 0.7);
        }

        [data-theme="light"] {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #1d1d1f;
            --text-secondary: #6e6e73;
            --border-color: rgba(0, 0, 0, 0.08);
            --nav-bg: rgba(255, 255, 255, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; transition: background 0.3s, color 0.3s; padding-top: 70px; }

        /* --- 2. 响应式半透明导航栏 --- */
        header { position: fixed; top: 0; left: 0; width: 100%; height: 64px; background-color: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 40px; z-index: 100; }
        .logo { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
        .search-bar-container { flex: 0 1 400px; position: relative; }
        .search-bar { width: 100%; padding: 8px 16px; background: rgba(128,128,128,0.1); border: none; border-radius: 8px; color: var(--text-color); font-size: 14px; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-btn { background: rgba(128,128,128,0.15); border: 0.5px solid var(--border-color); color: var(--text-color); padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.2s; text-decoration: none; }
        .nav-btn:hover { background: var(--text-color); color: var(--bg-color); }
        .nav-btn.primary { background: var(--apple-blue); color: #fff; border: none; }

        /* --- 3. 首屏内容与分类标签 --- */
        .hero { text-align: center; padding: 40px 20px 20px; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 40px; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.5px; }
        .categories { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .tab { padding: 6px 16px; background: rgba(128,128,128,0.1); border-radius: 15px; font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
        .tab.active, .tab:hover { background: var(--text-color); color: var(--bg-color); }

        /* --- 4. 瀑布流/网格图片大厅（响应式） --- */
        .gallery-grid { max-width: 1400px; margin: 0 auto; padding: 0 40px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; perspective: 1000px; }
        .card-wrapper { transform-style: preserve-3d; transition: transform 0.1s; }
        .card { background: var(--card-bg); border-radius: 18px; overflow: hidden; border: 0.5px solid var(--border-color); cursor: pointer; position: relative; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .img-box { width: 100%; aspect-ratio: 3/2; background: #333; overflow: hidden; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .card:hover .img-box img { transform: scale(1.04); }
        .card-info { padding: 16px; }
        .card-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
        .like-btn { color: #ff3b30; cursor: pointer; font-weight: 600; }

        /* --- 5. 弹窗系统（上传、详情、账户） --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 650px; border-radius: 24px; border: 0.5px solid var(--border-color); padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-color); font-size: 18px; cursor: pointer; }
        
        form input, form select, form textarea { width: 100%; padding: 10px; background: rgba(128,128,128,0.1); border: 0.5px solid var(--border-color); border-radius: 8px; color: var(--text-color); margin-bottom: 15px; font-family: inherit; }
        .comment-section { margin-top: 20px; border-top: 0.5px solid var(--border-color); padding-top: 15px; }
        .comment-list { max-height: 150px; overflow-y: auto; margin-bottom: 10px; font-size: 13px; }
        .comment-item { margin-bottom: 6px; color: var(--text-secondary); }
        .comment-item strong { color: var(--text-color); }

        /* --- 6. 响应式优化 --- */
        @media (max-width: 768px) {
            header { padding: 0 15px; }
            .search-bar-container { display: none; } /* 移动端隐藏搜索框简化布局 */
            .gallery-grid { grid-template-columns: 1fr; padding: 0 15px; }
            .hero h1 { font-size: 28px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">VISUALS HUB</div>
        <div class="search-bar-container">
            <input type="text" class="search-bar" id="searchInp" placeholder="搜索关键词、设备、颜色..." oninput="handleSearch()">
        </div>
        <div class="nav-right">
            <button class="nav-btn" onclick="toggleTheme()" id="themeBtn">🌓 切换主题</button>
            <button class="nav-btn primary" onclick="openModal('uploadModal')">+ 发布作品</button>
            <button class="nav-btn" onclick="openModal('accountModal')" id="userBtn">👤 账户/后台</button>
        </div>
    </header>

    <section class="hero">
        <h1 id="seoTitle">纵览光影视界</h1>
        <p>个性化推荐与敏捷互动的下一代视觉艺术平台。支持多维高级检索、版权保护声明与响应式无缝编辑流。</p>
        <div class="categories" id="tabsBox">
            <div class="tab active" onclick="switchCategory('all')">全部推荐</div>
            <div class="tab" onclick="switchCategory('自然')">自然</div>
            <div class="tab" onclick="switchCategory('人像')">人像</div>
            <div class="tab" onclick="switchCategory('美食')">美食</div>
        </div>
    </section>

    <main class="gallery-grid" id="gridBox"></main>

    <div class="modal" id="uploadModal" onclick="closeModal(event, 'uploadModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="document.getElementById('uploadModal').classList.remove('active')">✕</button>
            <h3 style="margin-bottom: 15px;">+ 上传新视觉作品</h3>
            <form id="uploadForm" onsubmit="handleUpload(event)">
                <label>输入图片URL链接 (或直接粘贴网络图片地址)：</label>
                <input type="url" id="imgUrl" required placeholder="https://example.com/photo.jpg">
                <input type="text" id="imgTitle" required placeholder="作品标题">
                <select id="imgCat">
                    <option value="自然">自然</option>
                    <option value="人像">人像</option>
                    <option value="美食">美食</option>
                </select>
                <input type="text" id="imgDevice" placeholder="拍摄设备 (例如: Hasselblad X2D)">
                <textarea id="imgDesc" placeholder="输入版权声明、作品描述或故事背后的故事..." rows="3"></textarea>
                <button type="submit" class="nav-btn primary" style="width: 100%; padding: 12px;">提交审核并同步发布</button>
            </form>
        </div>
    </div>

    <div class="modal" id="detailModal" onclick="closeModal(event, 'detailModal')">
        <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 800px;">
            <button class="close-btn" onclick="document.getElementById('detailModal').classList.remove('active')">✕</button>
            <div class="img-box" style="aspect-ratio: auto; max-height: 50vh; background: #000; border-radius: 12px;">
                <img id="detImg" src="" style="object-fit: contain;">
            </div>
            <h2 id="detTitle" style="margin: 15px 0 5px;">标题</h2>
            <p id="detDesc" style="color: var(--text-secondary); font-size: 14px; margin-bottom: 15px;">描述</p>
            
            <div style="background: rgba(128,128,128,0.1); padding: 15px; border-radius: 12px; font-size: 13px; line-height: 1.6;">
                <div>📷 <strong>拍摄设备:</strong> <span id="detDevice">-</span></div>
                <div>🛡️ <strong>版权状态:</strong> 原创内容·保留所有权利 (符合SEO及内容管理合规规范)</div>
            </div>

            <div class="comment-section">
                <h4>互动讨论区 (<span id="detCommCount">0</span>)</h4>
                <div class="comment-list" id="commListBox"></div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="commInp" placeholder="发表公开合规评论..." style="margin: 0; flex: 1;">
                    <button class="nav-btn primary" onclick="submitComment()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="accountModal" onclick="closeModal(event, 'accountModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="document.getElementById('accountModal').classList.remove('active')">✕</button>
            <h3>👤 高级站长中心 & 内容安全审计后台</h3>
            <p style="color: var(--text-secondary); font-size: 13px; margin: 10px 0 20px;">当前登录：Administrator (高级权限)</p>
            
            <h4 style="margin-bottom: 10px;">🛡️ 批量全站内容管理（点击直接下架删除）</h4>
            <div id="adminList" style="max-height: 250px; overflow-y: auto; border: 0.5px solid var(--border-color); border-radius: 8px; padding: 10px;"></div>
        </div>
    </div>

    <script>
        // A. 初始化核心内置种子数据 (保留之前的作品并充实新数据)
        const defaultImages = [
            { id: 1, title: "金色林海", cat: "自然", device: "Hasselblad X2D", desc: "捕捉于深秋日落时分，阳光穿透树冠形成的纯金屏障。", likes: 142, src: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80", comments: [{user:"摄影师小张", text:"这个金色调调调得太绝了！"}, {user:"AI系统", text:"符合黄金分割构图"}] },
            { id: 2, title: "逆光情绪", cat: "人像", device: "Sony A7R5", desc: "侧逆光影勾勒出情绪的张力，高像素细节毕现。", likes: 98, src: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80", comments: [] },
            { id: 3, title: "高奢法式甜品", cat: "美食", device: "Canon R5", desc: "微距视角下的米其林甜品层叠逻辑。", likes: 64, src: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80", comments: [] }
        ];

        let db = JSON.parse(localStorage.getItem('visuals_db')) || defaultImages;
        let currentImgId = null;
        let activeCategory = 'all';

        // B. 渲染画廊核心大厅控制 (融合3D动效计算)
        function renderGallery(data = db) {
            const gridBox = document.getElementById('gridBox');
            gridBox.innerHTML = '';
            
            data.forEach(item => {
                const wrap = document.createElement('div');
                wrap.className = 'card-wrapper';
                wrap.innerHTML = `
                    <div class="card" onclick="openDetail(${item.id})">
                        <div class="img-box"><img src="${item.src}" alt="${item.title}" loading="lazy"></div>
                        <div class="card-info">
                            <div class="card-title">${item.title}</div>
                            <div style="font-size:12px; color:var(--text-secondary)">标签: ${item.cat} | 设备: ${item.device || '未知'}</div>
                            <div class="card-actions">
                                <span class="like-btn" onclick="handleLike(event, ${item.id})">❤️ <span id="like-count-${item.id}">${item.likes}</span></span>
                                <span>💬 ${item.comments.length} 条互动</span>
                            </div>
                        </div>
                    </div>
                `;
                // 挂载苹果式 3D 视差单张卡片计算
                wrap.addEventListener('mousemove', (e) => {
                    const card = wrap.querySelector('.card');
                    const box = wrap.getBoundingClientRect();
                    card.style.transform = `rotateX(${- (e.clientY - box.top - box.height/2) / 15}deg) rotateY(${(e.clientX - box.left - box.width/2) / 15}deg)`;
                });
                wrap.addEventListener('mouseleave', () => {
                    wrap.querySelector('.card').style.transform = 'rotateX(0deg) rotateY(0deg)';
                });
                gridBox.appendChild(wrap);
            });
            saveDB();
            renderAdminBackend();
        }

        // C. 多维高敏模糊搜索功能
        function handleSearch() {
            const val = document.getElementById('searchInp').value.toLowerCase();
            const filtered = db.filter(item => 
                item.title.toLowerCase().includes(val) || 
                item.cat.toLowerCase().includes(val) || 
                item.device.toLowerCase().includes(val) ||
                item.desc.toLowerCase().includes(val)
            );
            renderGallery(filtered);
        }

        // D. 类属标签页切换切换
        function switchCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if(cat === 'all') { renderGallery(); } 
            else { renderGallery(db.filter(i => i.cat === cat)); }
        }

        // E. 互动机制：独立点赞
        function handleLike(e, id) {
            e.stopPropagation();
            const target = db.find(i => i.id === id);
            if(target) {
                target.likes++;
                document.getElementById(`like-count-${id}`).innerText = target.likes;
                saveDB();
            }
        }

        // F. 深度详情视窗控制（高斯模糊弹窗）
        function openDetail(id) {
            const target = db.find(i => i.id === id);
            if(!target) return;
            currentImgId = id;
            document.getElementById('detImg').src = target.src;
            document.getElementById('detTitle').innerText = target.title;
            document.getElementById('detDesc').innerText = target.desc || '主创团队暂未添加补充版权及设计描述。';
            document.getElementById('detDevice').innerText = target.device || '未录入专业摄影设备';
            document.getElementById('detCommCount').innerText = target.comments.length;
            
            const commBox = document.getElementById('commListBox');
            commBox.innerHTML = target.comments.map(c => `<div class="comment-item"><strong>${c.user}:</strong> ${c.text}</div>`).join('');
            openModal('detailModal');
        }

        function submitComment() {
            const txt = document.getElementById('commInp').value.trim();
            if(!txt) return;
            const target = db.find(i => i.id === currentImgId);
            target.comments.push({ user: "匿名访客", text: txt });
            document.getElementById('commInp').value = '';
            openDetail(currentImgId); // 刷新局部视图
            renderGallery();
        }

        // G. 全新图片上传发布及合规审核流
        function handleUpload(e) {
            e.preventDefault();
            const newPhoto = {
                id: Date.now(),
                title: document.getElementById('imgTitle').value,
                cat: document.getElementById('imgCat').value,
                device: document.getElementById('imgDevice').value || "未知设备",
                desc: document.getElementById('imgDesc').value,
                likes: 0,
                src: document.getElementById('imgUrl').value,
                comments: []
            };
            db.unshift(newPhoto); // 置顶推荐
            document.getElementById('uploadForm').reset();
            document.getElementById('uploadModal').classList.remove('active');
            renderGallery();
            alert("✨ 上传成功！内容已安全通过自动化AI合规审查，已同步上架全球数字大厅。");
        }

        // H. 管理员权限及内容管理中心控制
        function renderAdminBackend() {
            const box = document.getElementById('adminList');
            box.innerHTML = db.map(item => `
                <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-bottom:8px; background:rgba(128,128,128,0.05); padding:6px; border-radius:6px;">
                    <span>🎬 ${item.title} (${item.cat})</span>
                    <button class="nav-btn" style="padding:2px 8px; color:#ff3b30" onclick="deletePhoto(${item.id})">下架注销</button>
                </div>
            `).join('');
        }

        function deletePhoto(id) {
            if(confirm("确定要对该作品执行全网下架及版权注销清算吗？")) {
                db = db.filter(i => i.id !== id);
                renderGallery();
            }
        }

        // I. 界面主题自由切换（暗色 / 浅色极简）
        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', next);
        }

        // 工具级状态控制
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(e, id) { if(e.target.id === id) document.getElementById(id).classList.remove('active'); }
        function saveDB() { localStorage.setItem('visuals_db', JSON.stringify(db)); }

        // 程序主入口通电运行
        renderGallery();
    </script>
</body>
</html>
