<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUALS - 光影的轮廓</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
    <style>
        /* --- 基础与苹果暗黑美学定义 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: #f5f5f7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            padding-top: 80px; /* 留出悬浮导航栏空间 */
        }

        /* --- 1. Mac-style 磨砂玻璃导航栏 --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            color: #f5f5f7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .nav-btn.primary {
            background: #0071e3; /* Apple 经典蓝色 */
            border: none;
        }

        .nav-btn.primary:hover {
            background: #147ce5;
            color: #ffffff;
        }

        /* --- 2. 苹果大字报首屏 (Hero Section) --- */
        .hero {
            text-align: center;
            padding: 80px 20px 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 16px;
            color: #86868b;
            line-height: 1.5;
            font-weight: 300;
        }

        /* --- 3. 分类标签栏 --- */
        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .category-tab {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #86868b;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .category-tab:hover {
            color: #ffffff;
        }

        .category-tab.active {
            background: #ffffff;
            color: #000000;
            font-weight: 500;
        }

        /* --- 4. 作品卡片流 (流线布局与 3D 视差准备) --- */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px 80px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 30px;
            perspective: 1000px; /* 为3D翻转提供透视空间 */
        }

        .card-wrapper {
            transition: transform 0.1s ease;
            transform-style: preserve-3d;
        }

        .card {
            background: #121212;
            border-radius: 22px; /* 苹果偏爱的大圆角 */
            overflow: hidden;
            cursor: pointer;
            position: relative;
            /* 0.5px 高光修边边缘线 */
            border: 0.5px solid rgba(255, 255, 255, 0.08); 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 悬浮时的复合动态效果 */
        .card-wrapper:hover .card {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .image-container {
            width: 100%;
            background-color: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        /* 预设几种常见高级构图比例 */
        .ratio-21-9 { aspect-ratio: 21 / 9; }
        .ratio-3-2 { aspect-ratio: 3 / 2; }
        .ratio-16-9 { aspect-ratio: 16 / 9; }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card:hover .image-container img {
            transform: scale(1.03); /* 细腻的图片微缩放大 */
        }

        /* 卡片文字区 */
        .card-info {
            padding: 24px;
            background: #121212;
        }

        .card-meta {
            font-size: 12px;
            color: #86868b;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card-author {
            font-size: 13px;
            color: #0071e3;
        }

        /* --- 5. App Store 级别沉浸式膨胀弹窗 --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: #161617;
            width: 100%;
            max-width: 1100px;
            max-height: 85vh;
            border-radius: 30px;
            overflow-y: auto;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.95) translateY(30px);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.2);
        }

        .modal-hero-img {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            background: #000;
        }

        .modal-content {
            padding: 40px;
        }

        /* 交互式 Exif 仪表盘设计 */
        .exif-dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            background: rgba(255,255,255,0.03);
            padding: 24px;
            border-radius: 18px;
            border: 0.5px solid rgba(255,255,255,0.05);
            margin-top: 30px;
        }

        .exif-item {
            text-align: center;
        }

        .exif-label {
            font-size: 11px;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .exif-value {
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .gallery-container { grid-template-columns: 1fr; padding: 0 20px; }
            .exif-dashboard { grid-template-columns: repeat(2, 1fr); }
            header { padding: 0 20px; }
            .hero h1 { font-size: 36px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Visuals</div>
        <div class="nav-right">
            <button class="nav-btn" onclick="alert('进入高级开发者个人中心')">系统高级开发者个人中心</button>
            <button class="nav-btn primary" onclick="alert('触发发布作品流')">+ 发布作品</button>
            <button class="nav-btn" onclick="alert('安全退出')">退出账户</button>
        </div>
    </header>

    <section class="hero">
        <h1>光影的轮廓</h1>
        <p>透过不同媒介的视界，捕捉转瞬即逝的瞬间。开发者与作者现已全面解锁最高编辑修改权限。</p>
    </section>

    <div class="categories">
        <div class="category-tab active" onclick="filterCategory('all', this)">全部作品</div>
        <div class="category-tab" onclick="filterCategory('portrait', this)">人像</div>
        <div class="category-tab" onclick="filterCategory('nature', this)">自然</div>
        <div class="category-tab" onclick="filterCategory('cosplay', this)">Cosplay</div>
    </div>

    <main class="gallery-container" id="galleryGrid">
        
        <div class="card-wrapper" data-category="nature">
            <div class="card" onclick="openLightbox('金色林海', 'Hasselblad X2D', '38mm', 'f/4.0', '1/160s', '21:9', '系统预设', 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80')">
                <div class="image-container ratio-21-9">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="金色林海">
                </div>
                <div class="card-info">
                    <div class="card-meta">
                        <span>Hasselblad X2D · 38mm</span>
                        <span class="badge">21:9</span>
                    </div>
                    <div class="card-title">金色林海</div>
                    <div class="card-author">By: 系统预设</div>
                </div>
            </div>
        </div>

        <div class="card-wrapper" data-category="portrait">
            <div class="card" onclick="openLightbox('逆光情绪', 'Sony A7R5', '85mm', 'f/1.4', '1/250s', '3:2', '系统预设', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=80')">
                <div class="image-container ratio-3-2">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" alt="逆光情绪">
                </div>
                <div class="card-info">
                    <div class="card-meta">
                        <span>Sony A7R5 · 85mm</span>
                        <span class="badge">3:2</span>
                    </div>
                    <div class="card-title">逆光情绪</div>
                    <div class="card-author">By: 系统预设</div>
                </div>
            </div>
        </div>

    </main>

    <div class="modal-overlay" id="lightboxOverlay" onclick="closeLightbox(event)">
        <div class="modal-container" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeLightbox(force=true)">✕</button>
            <img class="modal-hero-img" id="modalImg" src="" alt="大图预览">
            <div class="modal-content">
                <h2 id="modalTitle" style="font-size: 28px; font-weight:600; margin-bottom:8px;">作品标题</h2>
                <p id="modalAuthor" style="color:#0071e3; font-size:14px; margin-bottom:20px;">By: 作者</p>
                
                <div class="exif-dashboard">
                    <div class="exif-item">
                        <div class="exif-label">相机机身</div>
                        <div class="exif-value" id="exifCamera">-</div>
                    </div>
                    <div class="exif-item">
                        <div class="exif-label">镜头焦距</div>
                        <div class="exif-value" id="exifLens">-</div>
                    </div>
                    <div class="exif-item">
                        <div class="exif-label">光圈大小</div>
                        <div class="exif-value" id="exifAperture">-</div>
                    </div>
                    <div class="exif-item">
                        <div class="exif-label">快门速度</div>
                        <div class="exif-value" id="exifShutter">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // A. 分类筛选流控制
        function filterCategory(category, element) {
            // 切换 Tab 激活状态
            document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');

            // 执行过滤动画
            document.querySelectorAll('.card-wrapper').forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                    setTimeout(() => { card.style.opacity = '1'; card.style.transform = 'scale(1)'; }, 10);
                } else {
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.95)';
                    setTimeout(() => { card.style.display = 'none'; }, 300);
                }
            });
        }

        // B. 苹果式 3D 视差微动效核心计算
        const wrappers = document.querySelectorAll('.card-wrapper');
        wrappers.forEach(wrapper => {
            wrapper.addEventListener('mousemove', (e) => {
                const card = wrapper.querySelector('.card');
                const box = wrapper.getBoundingClientRect();
                const x = e.clientX - box.left - (box.width / 2);
                const y = e.clientY - box.top - (box.height / 2);
                
                // 极度轻微的倾斜角度（正负2度），确保优雅不晃眼
                card.style.transform = `rotateX(${-y / 15}deg) rotateY(${x / 15}deg)`;
            });

            wrapper.addEventListener('mouseleave', () => {
                const card = wrapper.querySelector('.card');
                card.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
            });
        });

        // C. 膨胀弹窗流控制
        function openLightbox(title, camera, lens, aperture, shutter, ratio, author, bigImgUrl) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalAuthor').innerText = `By: ${author}`;
            document.getElementById('exifCamera').innerText = camera;
            document.getElementById('exifLens').innerText = lens;
            document.getElementById('exifAperture').innerText = aperture;
            document.getElementById('exifShutter').innerText = shutter;
            document.getElementById('modalImg').src = bigImgUrl;

            document.getElementById('lightboxOverlay').classList.add('active');
            document.body.style.overflow = 'hidden'; // 阻止底层网页滚动
        }

        function closeLightbox(event, force = false) {
            if (force || event.target.classList.contains('modal-overlay')) {
                document.getElementById('lightboxOverlay').classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
    </script>
</body>
</html>
